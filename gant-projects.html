<!doctype html>
<html lang=ru>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Nora-M · План проекта</title>
<style>
    :root {
        --paper: #f8f3e9;
        --ink: #281c15;
        --line: #e3d9ca;
        --muted: #66584e
    }

    * {
        box-sizing: border-box
    }

    body {
        margin: 0;
        background: radial-gradient(ellipse at 95% 0, #4a281c, transparent 52%), #100c0a;
        color: #fff2e6;
        font: 15px/1.45 system-ui, sans-serif
    }

    main {
        width: 100%;
        padding: clamp(10px, 2vw, 34px)
    }

    header,
    .head,
    .tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 9px
    }

    header {
        margin: 0 0 14px
    }

    h1,
    h2,
    h3,
    p {
        margin: 0
    }

    h1 {
        font-size: clamp(29px, 5vw, 55px);
        letter-spacing: -.07em
    }

    h2 {
        font-size: clamp(23px, 3vw, 32px);
        letter-spacing: -.045em
    }

    h3 {
        font-size: 16px
    }

    .tag {
        color: #ffab8e;
        font: 11px monospace;
        text-transform: uppercase;
        letter-spacing: .12em
    }

    .panel,
    .card {
        background: var(--paper);
        color: var(--ink);
        border-radius: 18px;
        padding: clamp(12px, 1.8vw, 26px);
        min-width: 0
    }

    .panel, .cards.ov {
        margin-bottom: 14px
    }

    .cards,
    .months {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px
    }

    .months {
        margin-top: 12px
    }

    .month {
        display: block;
        text-align: left;
        width: 100%;
        background: #eee5d8;
        padding: 12px;
        border: 0;
        border-radius: 12px
    }

    .month strong {
        display: block;
        font-size: clamp(16px, 2.4vw, 31px);
        letter-spacing: -.04em
    }

    .month span,
    .muted {
        color: var(--muted);
        font-size: 12px
    }

    .month:hover {
        transform: translateY(-2px)
    }

    .total {
        background: #292017;
        color: #fff2e6;
        padding: 7px 11px;
        border-radius: 10px;
        font-weight: 650
    }

    button {
        cursor: pointer;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid #c9baa8;
        border-radius: 9px;
        padding: 6px 9px;
        transition: background .2s, transform .2s
    }

    button:hover,
    button[aria-pressed=true] {
        background: #f9dbca
    }

    button:focus-visible,
    summary:focus-visible {
        outline: 2px solid #9f391d;
        outline-offset: 2px
    }

    .filters {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin: 10px 0
    }

    .filters button,
    .tools button {
        font-size: 12px
    }

    .scroll {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px
    }

    .grid {
        width: max-content;
        --left: 210px
    }

    .row {
        display: flex;
        min-height: 39px;
        border-bottom: 1px solid var(--line)
    }

    .label {
        position: sticky;
        left: 0;
        z-index: 3;
        background: #eee6d9;
        flex: none;
        width: var(--left);
        padding: 6px 9px;
        align-content: center;
        font-size: 13px;
        overflow-wrap: anywhere
    }

    .group .label,
    .group .track {
        background-color: #e7dbca;
        font-weight: 650
    }

    .track {
        position: relative;
        flex: none;
        background: repeating-linear-gradient(90deg, transparent 0 calc(var(--week) - 1px), var(--line) calc(var(--week) - 1px) var(--week))
    }

    .ticks {
        display: flex
    }

    .tick {
        flex: none;
        overflow: hidden;
        white-space: nowrap;
        padding: 12px 5px;
        font: 11px monospace
    }

    .bar,
    .mark {
        position: absolute
    }

    .bar {
        height: 14px;
        top: 12px;
        border: 0;
        padding: 0;
        background: linear-gradient(90deg, #c84220, #ff7850)
    }

    .bar:hover {
        background: #be3a1b;
        transform: scaleY(1.2)
    }

    .mark {
        white-space: nowrap;
        background: var(--paper);
        border: 0;
        padding: 2px 4px;
        font: 11px monospace
    }

    .pay {
        color: #933518
    }

    .review {
        color: #31594a
    }

    .now {
        position: absolute;
        inset-block: 0;
        border-left: 1px dashed #b74629;
        pointer-events: none
    }

    .legend {
        margin-top: 7px
    }

    .entry {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        padding: 6px 1px;
        font-size: 13px
    }

    .entry span {
        display: block;
        color: var(--muted);
        font-size: 11px
    }

    summary {
        cursor: pointer;
        margin-top: 8px;
        font-size: 12px;
        color: #90371e
    }

    .tip {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        opacity: 0;
        transform: translateY(4px);
        transition: .2s;
        background: #281d17;
        color: #fff1e7;
        border-radius: 9px;
        padding: 8px 11px;
        max-width: min(360px, calc(100vw - 16px));
        font-size: 13px
    }

    .tip.on {
        opacity: 1;
        transform: none
    }

    @media(max-width:820px) {

        .cards,
        .months {
            grid-template-columns: repeat(2, minmax(0, 1fr))
        }
    }

    @media(max-width:490px) {
        .grid {
            --left: 112px
        }

        .label {
            font-size: 11px;
            padding: 5px
        }

        .panel,
        .card {
            border-radius: 13px
        }
    }

    @media(max-width:335px) {

        .cards,
        .months {
            grid-template-columns: 1fr
        }
    }

    @media(prefers-reduced-motion:reduce) {
        * {
            transition: none !important
        }
    }
</style>
<main>
    <header>
        <h1>Nora-M</h1><span class=tag>Клиентский план · Ноябрь 2026 / Февраль 2027</span>
    </header>
    
    <section class=panel>
        <div class=head>
            <div>
                <h2>Оплаты по месяцам</h2>
                <p class=muted>Плановые суммы по датам платежей</p>
            </div><span class=total id=total></span>
        </div>
        <div id=months class=months></div>
    </section>
    <div class=cards id=cards></div>
    <section class=panel id=gantt>
        <div class=head>
            <h2>График проекта</h2>
            <div class=tools>
                <div id=zoom aria-label="Масштаб"></div>
                <div><button id=prev aria-label="Назад">←</button> <button id=today>Сегодня</button> <button id=next
                        aria-label="Вперёд">→</button></div>
            </div>
        </div>
        <div class=filters id=filters></div>
        <div class=scroll id=sc tabindex=0 aria-label="Диаграмма Ганта">
            <div id=grid class=grid></div>
        </div>
        <p class="legend muted"><span class=pay>◆ Оплата</span> · <span class=review>◆ Согласование</span> · Окончание
            работ рассчитано по рабочему календарю XML</p>
    </section>
</main>
<div id=tip class=tip role=tooltip aria-hidden=true></div>

<style id=nora-dock-style>
    body {
        padding-bottom: 86px
    }

    #noraDock {
        position: fixed;
        z-index: 40;
        top: max(10px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100vw - 18px);
        color: #fff2e6;
        font: 13px/1.3 system-ui, sans-serif
    }

    #noraDock .nd-bar,
    #noraDock .nd-menu {
        background: rgba(25, 19, 16, .91);
        border: 1px solid #fff2e62b;
        box-shadow: inset 0 1px 0 #ffffff12, 0 9px 35px #0007
    }

    @supports(backdrop-filter:blur(14px)) {

        #noraDock .nd-bar,
        #noraDock .nd-menu {
            background: rgba(25, 19, 16, .74);
            backdrop-filter: blur(16px) saturate(1.35)
        }
    }

    #noraDock .nd-bar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px;
        border-radius: 999px
    }

    #noraDock button,
    #noraDock a {
        display: block;
        text-decoration: none;
        color: inherit;
        font: inherit;
        white-space: nowrap;
        border: 0;
        border-radius: 999px;
        padding: 8px 11px;
        background: transparent;
        cursor: pointer;
        transition: background .22s, transform .22s
    }

    #noraDock a:hover,
    #noraDock button:hover {
        background: #ffffff14
    }

    #noraDock a[aria-current=true],
    #noraDock button[aria-pressed=true] {
        background: #ff4a1c;
        color: #190d08;
        font-weight: 650
    }

    #noraDock :focus-visible {
        outline: 2px solid #ffa782;
        outline-offset: 2px
    }

    #noraDock .nd-brand {
        color: #ff9e7e;
        padding: 0 7px;
        font: 11px monospace;
        white-space: nowrap
    }

    #noraDock .nd-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 7px);
        padding: 9px;
        border-radius: 17px;
        min-width: 220px
    }

    #noraDock .nd-menu[hidden] {
        display: none
    }

    #noraDock .nd-scale {
        display: flex;
        gap: 4px;
        margin: 6px 0
    }

    #noraDock .nd-caption {
        color: #ffac8d;
        font: 11px monospace;
        padding: 3px 8px
    }

    #noraDock .nd-menu>button {
        text-align: left;
        width: 100%
    }

    main {
        padding-top: clamp(72px, 8vw, 102px) !important
    }

    #gantt,
    #months,
    #cards {
        scroll-margin-top: 75px
    }

    #tip {
        z-index: 50
    }

    body.nd-compact .row {
        min-height: 32px
    }

    body.nd-compact .label {
        padding-top: 3px;
        padding-bottom: 3px
    }

    body.nd-compact .bar {
        top: 9px;
        height: 13px
    }

    body.nd-compact .tick {
        padding-top: 8px;
        padding-bottom: 8px
    }

    body.nd-compact .card,
    body.nd-compact .panel {
        padding: 12px
    }

    body.nd-compact .entry {
